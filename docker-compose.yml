version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coalguard
    ports:
      - "55432:5432"
    volumes:
      - coalguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENER_NAME_PLAINTEXT_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/coalguard
      - NODE_ENV=development
      - AUTH_MODE=development
      - DATA_PROVENANCE=development
      - ALLOW_DEV_SEED=true
      - CORS_ORIGINS=http://localhost:3000
      - STORAGE_DIR=/app/data/documents
      - REPORT_DIR=/app/data/reports
    volumes:
      - ./backend:/app
      - /app/node_modules
      - coalguard_docs:/app/.data/documents
      - coalguard_reports:/app/.data/reports
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_DATA_SOURCE=api
      - NEXT_PUBLIC_AUTH_MODE=development
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./next.config.js:/app/next.config.js
    depends_on:
      - backend
    command: npm run dev

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - COALGUARD_AI_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/coalguard
      - COALGUARD_AI_AUTH_MODE=development
      - COALGUARD_AI_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - COALGUARD_AI_LOG_LEVEL=INFO
      - COALGUARD_AI_SEARCH_PROVIDER=mock
    volumes:
      - ./ai-service:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  coalguard_pg_data:
  coalguard_docs:
  coalguard_reports:
  kafka_data: