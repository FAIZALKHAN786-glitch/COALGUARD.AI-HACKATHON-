[project]
name = "coalguard-ai"
version = "0.1.0"
description = "CoalGuard.AI AI Intelligence Subsystem - FastAPI service for anomaly detection, prediction, investigation, and research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pgvector>=0.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "pydantic-extra-types>=2.10.0",
    "python-multipart>=0.0.20",
    "tenacity>=9.0.0",
    "structlog>=25.1.0",
    "prometheus-client>=0.21.0",
    "httpx-retry>=0.4.0",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "scikit-learn>=1.6.0",
    "xgboost>=3.0.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "joblib>=1.4.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "sentence-transformers>=3.4.0",
    "chromadb>=0.5.0",
    "aiokafka>=0.10.0",
    "redis>=5.2.0",
    "faiss-cpu>=1.9.0",
    "onnxruntime>=1.20.0",
    "evidently>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-requests>=2.32.0",
    "httpx>=0.28.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W"]
ignore = ["S101", "B008"]
extend-exclude = [".venv", "dist", "build", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
ignore_missing_imports = true